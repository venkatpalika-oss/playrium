name: Deploy Playrium to Namecheap

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare files
        run: |
          mkdir -p /tmp/deploy-dist
          rsync -a ./ /tmp/deploy-dist/ --exclude='.git*' --exclude='.github' --exclude='.vscode' --exclude='README.md'

      - name: SFTP Deploy
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          server: 'server260.web-hosting.com'
          port: '21098'
          username: 'playszzp'
          ssh_private_key: ${{ secrets.NC_SSH_PRIVATE_KEY }}
          local_path: '/tmp/deploy-dist/*'
          remote_path: '/home/playszzp/public_html'
          sftp_only: true
          delete_remote_files: false
